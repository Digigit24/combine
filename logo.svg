<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Digitech Solutions">
  <defs>
    <clipPath id="logoSphereClip">
      <circle cx="48" cy="48" r="38" />
    </clipPath>
  </defs>

  <!-- ===== DOTTED WIREFRAME GLOBE ===== -->

  <!-- Sphere outline -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="#6B7280" stroke-width="1.4" />

  <!-- Wireframe (latitudes + meridians), clipped to sphere -->
  <g clip-path="url(#logoSphereClip)" fill="none" stroke="#9CA3AF" stroke-width="0.9">
    <!-- latitudes -->
    <ellipse cx="48" cy="48" rx="38" ry="9" />
    <ellipse cx="48" cy="48" rx="38" ry="18" />
    <ellipse cx="48" cy="48" rx="38" ry="27" />
    <ellipse cx="48" cy="48" rx="38" ry="34" />
    <line x1="10" y1="48" x2="86" y2="48" />
    <!-- meridians -->
    <ellipse cx="48" cy="48" rx="9" ry="38" />
    <ellipse cx="48" cy="48" rx="18" ry="38" />
    <ellipse cx="48" cy="48" rx="27" ry="38" />
    <ellipse cx="48" cy="48" rx="34" ry="38" />
    <line x1="48" y1="10" x2="48" y2="86" />
  </g>

  <!-- Pixel dots overlay -->
  <g fill="#9CA3AF">
    <circle cx="32" cy="22" r="1" /><circle cx="48" cy="18" r="1" /><circle cx="64" cy="22" r="1" />
    <circle cx="22" cy="30" r="1" /><circle cx="38" cy="26" r="1" /><circle cx="58" cy="26" r="1" /><circle cx="74" cy="30" r="1" />
    <circle cx="16" cy="38" r="1" /><circle cx="30" cy="34" r="1" /><circle cx="48" cy="30" r="1" /><circle cx="66" cy="34" r="1" /><circle cx="80" cy="38" r="1" />
    <circle cx="14" cy="48" r="1" /><circle cx="26" cy="44" r="1" /><circle cx="40" cy="40" r="1" /><circle cx="56" cy="40" r="1" /><circle cx="70" cy="44" r="1" /><circle cx="82" cy="48" r="1" />
    <circle cx="16" cy="58" r="1" /><circle cx="30" cy="62" r="1" /><circle cx="48" cy="66" r="1" /><circle cx="66" cy="62" r="1" /><circle cx="80" cy="58" r="1" />
    <circle cx="22" cy="66" r="1" /><circle cx="38" cy="70" r="1" /><circle cx="58" cy="70" r="1" /><circle cx="74" cy="66" r="1" />
    <circle cx="32" cy="74" r="1" /><circle cx="48" cy="78" r="1" /><circle cx="64" cy="74" r="1" />
  </g>

  <!-- ===== WORDMARK ===== -->

  <!-- DIGITECH (teal, bold) -->
  <text x="108" y="52"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="36"
        font-weight="900"
        letter-spacing="-0.5"
        fill="#14B8A6">DIGITECH</text>

  <!-- Thin divider line under DIGITECH -->
  <line x1="108" y1="60" x2="302" y2="60" stroke="#14B8A6" stroke-width="1.2" opacity="0.7" />

  <!-- SOLUTIONS (green, spaced out) -->
  <text x="108" y="76"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="6"
        fill="#65A30D">SOLUTIONS</text>
</svg>
